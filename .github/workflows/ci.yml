name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        run: swift test
      - name: App bauen
        run: ./scripts/build-app.sh
      - name: App-Bundle hochladen
        uses: actions/upload-artifact@v4
        with:
          name: HabitDashboard.app
          path: build/HabitDashboard.app
      - name: Icon-Vorschau hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AppIcon-Vorschau
          path: build/AppIcon.iconset/icon_256x256@2x.png
